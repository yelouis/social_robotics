<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SRB rater</title>
<style>
  :root{--bg:#14161a;--panel:#1c2027;--line:#2c313b;--fg:#e8eaed;--dim:#8d95a3;
        --acc:#5aa9ff;--ok:#3ddc97;--warn:#ffb454;--bad:#ff6b6b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
  #wrap{display:grid;grid-template-columns:minmax(420px,1fr) minmax(430px,510px);
        gap:18px;padding:16px;height:100vh}
  #left{display:flex;flex-direction:column;gap:10px;min-width:0}
  video{width:100%;background:#000;border-radius:8px;outline:none}
  #right{overflow-y:auto;padding-right:6px}
  .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .prog{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
  .prog>i{display:block;height:100%;background:var(--acc);width:0}
  .muted{color:var(--dim);font-size:12px}
  .hint{color:var(--dim);font-size:12px;font-style:italic}
  .q{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);
     border-radius:8px;padding:10px 12px;margin-bottom:9px}
  .q.active{border-left-color:var(--acc)}
  .q.done{border-left-color:var(--ok)}
  .q.skipped{opacity:.4}
  .q h3{margin:0 0 7px;font-size:13px;font-weight:600}
  .q h3 b{color:var(--acc);font-weight:600}
  .cb{display:inline-block;vertical-align:1px;margin-left:4px;padding:1px 8px;
      border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;cursor:pointer;
      border:1px solid transparent}
  .cb.moment{background:rgba(90,169,255,.16);color:#8cc6ff;border-color:rgba(90,169,255,.4)}
  .cb.after{background:rgba(255,180,84,.16);color:var(--warn);border-color:rgba(255,180,84,.45)}
  .cb.both{background:#242932;color:var(--dim);border-color:var(--line);cursor:default}
  .cb.moment:hover{background:rgba(90,169,255,.3)}
  .cb.after:hover{background:rgba(255,180,84,.3)}
  .qnote{color:var(--dim);font-size:11.5px;font-style:italic;margin:-2px 0 7px}
  .qh{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;
      border-radius:50%;border:1px solid var(--line);background:#242932;color:var(--dim);
      font-size:11px;font-weight:700;cursor:pointer;margin-left:4px;vertical-align:1px}
  .qh:hover,.qh.on{border-color:var(--acc);color:var(--acc)}
  .help{background:#11151b;border:1px solid var(--line);border-radius:6px;
        padding:9px 11px;margin:0 0 8px;font-size:12.5px;line-height:1.5}
  .help p{margin:0 0 6px}
  .help ul{margin:0 0 6px;padding-left:0;list-style:none}
  .help li{padding-left:16px;position:relative;color:var(--dim);margin-bottom:2px}
  .help li:before{position:absolute;left:0;font-weight:700}
  .help ul.yes li:before{content:"✓";color:var(--ok)}
  .help ul.no li:before{content:"✗";color:var(--bad)}
  .help dl{margin:0 0 6px;display:grid;grid-template-columns:auto 1fr;gap:2px 8px}
  .help dt{color:var(--acc);font-weight:600;white-space:nowrap}
  .help dd{margin:0;color:var(--dim)}
  .help .tip{color:var(--warn);margin:6px 0 0}
  .help .tip:before{content:"▸ ";font-weight:700}
  .seed{background:#161d17;border:1px solid #2a3a2e;border-left:3px solid var(--ok);
        border-radius:6px;padding:7px 10px;margin:0 0 8px;font-size:12.5px}
  .seed.conflict{background:#1d1a16;border-color:#3a332a;border-left-color:var(--warn)}
  .seed .shead{color:var(--ok);font-weight:700;font-size:11px;text-transform:uppercase;
               letter-spacing:.04em;margin-bottom:5px}
  .seed.conflict .shead{color:var(--warn)}
  .srow{margin-bottom:5px}
  .smodel{display:inline-block;min-width:96px;color:var(--dim);font-size:11px;
          font-family:ui-monospace,monospace}
  button.sval{background:#242932;color:var(--fg);border:1px solid var(--line);
              border-radius:5px;padding:2px 9px;font-size:12px;cursor:pointer;font-weight:600}
  button.sval:hover{border-color:var(--acc)}
  button.sval.chosen{background:var(--acc);border-color:var(--acc);color:#08111c}
  .sval.none{color:var(--dim)}
  .seed .sr{color:var(--dim);margin:2px 0 0 96px;line-height:1.45}
  .seed .conflictnote{margin-left:0;color:var(--warn);font-style:italic}
  #seedbanner{background:#161d17;border:1px solid #2a3a2e;border-radius:6px;
              padding:6px 10px;font-size:12px;color:var(--dim);margin-bottom:2px}
  #seedbanner b{color:var(--ok)}
  .opts{display:flex;flex-wrap:wrap;gap:6px}
  button.opt{background:#242932;color:var(--fg);border:1px solid var(--line);
             border-radius:6px;padding:7px 11px;font-size:13px;cursor:pointer;
             display:flex;align-items:center;gap:7px}
  button.opt:hover{border-color:var(--acc)}
  button.opt.sel{background:var(--acc);border-color:var(--acc);color:#08111c;font-weight:600}
  button.opt.sel.flag{background:var(--warn);border-color:var(--warn)}
  kbd{background:#0f1319;border:1px solid var(--line);border-radius:3px;
      padding:0 5px;font-size:11px;color:var(--dim);font-family:ui-monospace,monospace}
  button.opt.sel kbd{background:rgba(0,0,0,.22);color:#08111c;border-color:transparent}
  input[type=text],textarea{width:100%;background:#0f1319;color:var(--fg);
      border:1px solid var(--line);border-radius:6px;padding:7px 9px;font:inherit}
  textarea{resize:vertical;min-height:38px}
  .row{display:flex;gap:8px;align-items:center}
  .btn{background:var(--acc);color:#08111c;border:0;border-radius:7px;
       padding:9px 15px;font-size:14px;font-weight:600;cursor:pointer}
  .btn:disabled{background:#39414f;color:var(--dim);cursor:not-allowed}
  .btn.ghost{background:#242932;color:var(--fg);border:1px solid var(--line);font-weight:500}
  .btn.ghost.on{border-color:var(--acc);color:#8cc6ff}
  #tS.on{border-color:var(--acc);color:#8cc6ff}
  #tP.on{border-color:var(--warn);color:var(--warn)}
  .warnnote{color:var(--warn);font-size:12px;font-weight:600}
  #toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
         background:var(--ok);color:#062015;padding:8px 16px;border-radius:20px;
         font-weight:600;opacity:0;transition:opacity .18s;pointer-events:none}
  #toast.show{opacity:1}
  #toast.err{background:var(--bad);color:#2b0808}
  .pill{background:#242932;border:1px solid var(--line);border-radius:20px;
        padding:2px 10px;font-size:12px;color:var(--dim)}
  a{color:var(--acc)}
</style>
</head>
<body>
<div id="wrap">
  <div id="left">
    <div class="bar">
      <button class="btn ghost" id="prev">&larr;</button>
      <div class="prog"><i id="progbar"></i></div>
      <button class="btn ghost" id="next">&rarr;</button>
    </div>
    <div class="bar">
      <span class="pill" id="counter">—</span>
      <span class="pill" id="stats">—</span>
      <span class="pill" id="timer">0s</span>
      <button class="btn ghost" id="helpall" style="padding:3px 10px;font-size:12px">
        Definitions <kbd>?</kbd></button>
      <span class="muted" id="mode"></span>
    </div>
    <video id="vid" controls autoplay loop playsinline></video>
    <div class="bar">
      <button class="btn ghost" id="tS">Moment <kbd>S</kbd></button>
      <button class="btn ghost" id="tP">After-roll <kbd>D</kbd></button>
      <button class="btn ghost" id="replay">Replay <kbd>R</kbd></button>
      <span class="muted" id="clipinfo"></span>
    </div>
    <div class="muted" id="nowplaying"></div>
    <div class="hint" id="hint"></div>
    <div class="muted">Keys: <kbd>1</kbd>…<kbd>5</kbd> answer active question ·
      <kbd>↑</kbd><kbd>↓</kbd> move · <kbd>Enter</kbd> save &amp; next ·
      <kbd>Space</kbd> play/pause</div>
  </div>

  <div id="right">
    <div id="form"></div>
    <div class="row" style="margin:12px 0 30px">
      <button class="btn" id="save">Save &amp; next <kbd>⏎</kbd></button>
      <span class="muted" id="valid"></span>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
// `clip` = which video answers this question (rendered as a clickable badge):
//   moment = Clip S only · after = Clip S+ only · both = either/neither.
// Only B7 uses the after-roll — that split is the F4 information boundary
// (the model sees Clip S and must PREDICT what B7 records). Answer B1-B6 from
// the moment BEFORE opening the after-roll, or hindsight leaks into B5.
// `help` is the AUTHORITATIVE per-question definition (LABELING_GUIDE.md covers
// ambiguous *cases*; this covers the *terms*). Wording is deliberately
// operational — a rule you can apply the same way twice three days apart,
// because the v0 gate is test-retest self-consistency on B3/B4/B5.
const SCHEMA = [
  {id:"A1", clip:"moment", q:"<b>A1</b> Besides the camera wearer, can you see at least one person?",
   opts:[["yes","Yes"],["no","No"],["unsure","Unsure"]],
   help:{what:"Is another real human visible at any point in the moment clip? A face is not required — any identifying body part counts.",
     counts:["Hands, arms, torso, legs of someone who is not the wearer",
             "Someone partly out of frame, or briefly passing through",
             "Someone far away but clearly recognisable as a person"],
     excludes:["The wearer's OWN hands, arms, legs or reflection — the commonest egocentric mistake",
               "People on a screen, poster, photo or in a mirror only",
               "Shapes too small or dark to tell whether they are human (use Unsure)"]}},
  {id:"A2", clip:"moment", q:"<b>A2</b> Is the moment watchable? (not too dark/blurred/occluded to judge behavior)",
   opts:[["yes","Yes"],["no","No"]],
   help:{what:"Could you judge a person's behaviour IF they reacted? This is a floor on legibility, not a judgement of video quality.",
     counts:["Dim, grainy, or wobbly but people's movements are still readable",
             "Part of the window is blurred but the rest is usable"],
     excludes:["Near-black, lens covered, or whip-pan for essentially the whole clip",
               "The only person is a handful of pixels across"],
     tip:"When in doubt answer Yes — B8 (confidence) is where uncertainty belongs."}},
  {id:"A3", clip:"both", q:"<b>A3</b> Content flags (quarantines the moment)", multi:true,
   note:"flag anything you notice in either clip",
   opts:[["minor","Minor focal"],["nudity_private","Nudity/private"],
         ["sensitive_info","Sensitive info"],["distress","Distress"],["other","Other"]],
   help:{what:"Anything that would make this moment unwise to publish or to keep. A flag quarantines the moment — it is excluded from the benchmark, so flag freely.",
     each:{minor:"A child is a main visible participant (not incidentally in a background crowd)",
           nudity_private:"Undress, bathroom/bedroom/medical context, or anything obviously private",
           sensitive_info:"Readable screens, documents, addresses, licence plates, ID cards",
           distress:"Someone visibly upset, injured, frightened, or in real conflict",
           other:"Anything else you would hesitate to show a stranger — say why in B9"}}},
  {id:"B1", clip:"moment", q:"<b>B1</b> What does the <u>camera wearer</u> do? (verb first)", text:true,
   quick:[["conversation","conversation"],["unclear","unclear"]],
   help:{what:"The physical action of the person WEARING the camera — you see through their eyes; their hands enter from the bottom of frame. Verb first, present tense, roughly 5–12 words, and name the target: “hands a card to the player opposite”.",
     each:{conversation:"Wearer is only talking or listening — no discrete physical act",
           unclear:"You genuinely cannot tell what the wearer did (blur, action off-frame)"},
     tip:"Trap: when the most eye-catching motion belongs to a BYSTANDER, still describe the wearer — usually “conversation” or “watches …”. Never describe the bystander's action here."}},
  {id:"B2", clip:"moment", q:"<b>B2</b> Is at least one visible person positioned to notice the action?",
   opts:[["yes","Yes"],["no","No"],["unsure","Unsure"]],
   help:{what:"Could someone have PERCEIVED the wearer's action, whether or not they responded? This is about opportunity, not response — B3 asks whether anything actually happened.",
     counts:["Facing the wearer, or turned toward the shared activity or workspace",
             "Close enough that ordinary speech or movement would register (roughly within a few metres)",
             "Engaged in the same task, table, or conversation as the wearer"],
     excludes:["Turned away AND far off, or absorbed in something unrelated across the room",
               "Behind a barrier, or a distant passer-by who never orients toward the wearer"],
     tip:"Yes here with No on B3 is a valuable combination, not a contradiction: someone could have responded and did not. That is the control class the benchmark needs."}},
  {id:"B3", clip:"moment", q:"<b>B3</b> Does any visible person noticeably react?",
   opts:[["yes","Yes"],["no","No"],["unsure","Unsure"]],
   help:{what:"Did any visible person's behaviour visibly CHANGE during the clip? A change of state, not a steady state. Useful test: compare the person at the start of the window with the same person at the end — would a bystander say “something happened there”?",
     counts:["Expression changes (a smile or frown appears)",
             "Head movement: nod, shake, turn toward or away",
             "Gesture: point, wave, hand raised, object offered",
             "Body movement: steps closer or back, leans in, flinches, straightens up",
             "Audible: speech starts, laugh, exclamation",
             "Gaze shifts to or away from the wearer"],
     excludes:["Simply continuing an activity they were already doing",
               "Merely being present, standing, or looking on unchanged",
               "Apparent motion caused by the CAMERA moving — that is the wearer, not them"],
     tip:"Answer for ANY visible person, even one clearly reacting to their phone. Who the reaction was FOR is B4's job, not this one."}},
  {id:"B4", clip:"moment", q:"<b>B4</b> What is the reaction most likely responding to?",
   opts:[["wearer","The wearer's action"],["something_else","Something/someone else"],
         ["cant_tell","Can't tell"]],
   help:{what:"Credit assignment: what caused the reaction you just recorded? Weigh three things — timing (did it follow the wearer's action closely?), orientation (were they turned toward the wearer or the object involved?), and plausibility (does it make sense as a response to that action?).",
     each:{wearer:"Follows the wearer's action and is oriented toward the wearer, their hands, or the object involved",
           something_else:"Clearly responding to a phone, a third person, their own task, or an off-screen event",
           cant_tell:"A reaction happened but the evidence for its target is genuinely balanced or missing"},
     tip:"“Can't tell” is a real answer that scores — models are graded on abstaining here. Never force a guess to avoid it."}},
  {id:"B5", clip:"moment", q:"<b>B5</b> How would the wearer most reasonably read this reaction?",
   note:"judge the reaction itself — decide this BEFORE watching the after-roll",
   opts:[["approving","Approving"],["disapproving","Disapproving"],
         ["neutral","Neutral ack."],["mixed","Mixed/ambiguous"]],
   help:{what:"Take the wearer's perspective: received as feedback on what I just did, was this positive, negative, or neither? Not “was the person happy” in general.",
     each:{approving:"Smile, nod, laugh along, thumbs-up, accepts the object, moves closer, warm tone",
           disapproving:"Frown, head shake, recoil or pull away, refusal, correction, sharp tone",
           neutral:"Noticed with no evaluation — a glance up and back down, a flat acknowledgement",
           mixed:"Genuinely both at once (laughs but backs away), or readable either way"},
     tip:"Neutral is not the same as “can't tell”: neutral means you SAW acknowledgement carrying no valence. If you cannot read it at all, that is Mixed plus a lower B8."}},
  {id:"B6", clip:"moment", q:"<b>B6</b> Evidence channels (all that apply)", multi:true,
   opts:[["face","Face"],["head_gesture","Head gesture"],["hand_body","Hand/body"],
         ["proxemics","Proxemics"],["voice","Voice"],["gaze","Gaze"]],
   help:{what:"Which signals did YOU actually use to reach your answers? Tick what you used, not everything theoretically present — this feeds per-channel reporting (“models read proxemics but miss prosody”), never the gold answer.",
     each:{face:"Facial expression", head_gesture:"Nod, shake, tilt",
           hand_body:"Hand gesture or body posture", proxemics:"Moving nearer or further away",
           voice:"Anything audible — speech, laugh, tone", gaze:"Where they looked; attention shifting"}}},
  {id:"B7", clip:"after", q:"<b>B7</b> Right after, does the wearer change what they are doing?",
   note:"the only question needing the after-roll",
   opts:[["continues","Continues"],["adjusts","Adjusts/corrects"],
         ["stops","Stops/disengages"],["cant_tell","Can't tell"]],
   help:{what:"In the after-roll, what does the WEARER do next? Purely descriptive — record what happened, never whether it was the right response, and do not worry about whether the reaction caused it.",
     each:{continues:"Same activity, no visible change of course",
           adjusts:"Same goal, changed execution — repeats, corrects, slows, redirects, hands it over differently",
           stops:"Abandons or disengages — walks away, puts it down, switches to something unrelated",
           cant_tell:"After-roll too blurred, too short, or too ambiguous to say"},
     tip:"Judge the wearer's own behaviour, not the bystanders'."}},
  {id:"B8", clip:"both", q:"<b>B8</b> Your confidence in this moment",
   opts:[["confident","Confident"],["somewhat","Somewhat"],["guessing","Guessing"]],
   help:{what:"How much would you trust your own answers here?",
     each:{confident:"You would give the same answers again next week",
           somewhat:"The main calls are solid; one field is shaky",
           guessing:"You are not really sure"},
     tip:"Use Guessing freely — those moments are dropped from the test set automatically, so honesty here protects the benchmark instead of costing you anything."}},
  {id:"B9", q:"<b>B9</b> Notes / flags (optional)", text:true,
   help:{what:"Anything odd worth remembering: the window looks mistimed, several people react at once, the content looks staged, the machine caption is wrong, or you nearly chose a different answer."}},
  {id:"C1", q:"<b>C1</b> Missed moment in this clip? (timestamp + note, optional)", text:true,
   note:"about the whole source video, not these two cuts",
   help:{what:"If you happen to notice a clear social reaction elsewhere in this source video that the system never proposed, note its rough timestamp. This measures the engine's recall for free and feeds a hard-case pool.",
     tip:"Entirely opportunistic — never go hunting for these."}},
];
const CLIP_LABEL={moment:"▶ Moment", after:"▶ After-roll", both:"either clip"};

let S={moments:[],ratings:{},seeds:{},i:0,ans:{},active:0,t0:Date.now(),mode:"main",
       help:new Set(), helpAll:localStorage.getItem("srb_help_all")==="1"};

const $=s=>document.querySelector(s);
const cur=()=>S.moments[S.i];
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");

function seedPicksFor(mid,qid){
  // [{model, value, rationale}] for one question, across every seeding model.
  const by=S.seeds[mid]||{};
  return Object.entries(by).map(([model,s])=>{
    let v=s[qid];
    if(Array.isArray(v)) v=v.join(";");
    return {model, value:(v===undefined||v===null)?"":String(v),
            rationale:(s.rationale||{})[qid]||""};
  }).filter(p=>p.value!==""||p.rationale);
}
function seedConsensusFor(mid,qid){
  // null = no seeds · {value} = all models agree · {conflict:[…]} = they differ
  const picks=seedPicksFor(mid,qid).filter(p=>p.value!=="");
  if(!picks.length) return null;
  const vals=[...new Set(picks.map(p=>p.value.toLowerCase()))];
  return vals.length===1 ? {value:picks[0].value, picks} : {conflict:picks};
}
const seedPicks=qid=>seedPicksFor(cur().moment_id,qid);
const seedConsensus=qid=>seedConsensusFor(cur().moment_id,qid);

function seedHTML(q){
  const picks=seedPicks(q.id);
  if(!picks.length) return "";
  const con=seedConsensus(q.id);
  const conflict=con&&con.conflict;
  const mine=(S.ans[q.id]||"").toLowerCase();
  let h=`<div class="seed${conflict?" conflict":""}">`;
  h+=`<div class="shead">${conflict?"models disagree — you decide"
        :"model suggestion"+(picks.length>1?" (all agree)":"")}</div>`;
  for(const p of picks){
    const chosen=mine&&p.value&&mine===p.value.toLowerCase();
    h+=`<div class="srow">
          <span class="smodel">${esc(p.model)}</span>
          ${p.value?`<button class="sval${chosen?" chosen":""}" data-adopt="${q.id}"
                       data-val="${esc(p.value)}" title="use this answer"
                     >${esc(p.value)}</button>`:'<span class="sval none">—</span>'}
          ${p.rationale?`<div class="sr">${esc(p.rationale)}</div>`:""}
        </div>`;
  }
  if(conflict&&!mine) h+=`<div class="sr conflictnote">Left blank on purpose: pick the
      one you agree with, or answer independently.</div>`;
  return h+`</div>`;
}

function helpHTML(hp){
  let h=`<div class="help"><p>${hp.what}</p>`;
  if(hp.counts) h+=`<ul class="yes">`+hp.counts.map(x=>`<li>${x}</li>`).join("")+`</ul>`;
  if(hp.excludes) h+=`<ul class="no">`+hp.excludes.map(x=>`<li>${x}</li>`).join("")+`</ul>`;
  if(hp.each) h+=`<dl>`+Object.entries(hp.each)
      .map(([k,v])=>`<dt>${esc(k)}</dt><dd>${v}</dd>`).join("")+`</dl>`;
  if(hp.tip) h+=`<p class="tip">${hp.tip}</p>`;
  return h+`</div>`;
}

function visible(id){
  const a=S.ans;
  const triagedOut = a.A1!=="yes" || (a.A2 && a.A2!=="yes") || (a.A1 && !a.A2);
  if(["A1","A2","A3","C1"].includes(id)) return true;
  if(a.A1!=="yes"||a.A2!=="yes") return false;            // triage drop → B skipped
  if(["B1","B2","B3","B8","B9"].includes(id)) return true;
  if(a.B3!=="yes") return false;                          // no reaction → B4-B7 skipped
  if(id==="B4"||id==="B6") return true;
  if(id==="B5") return a.B4==="wearer";                   // only wearer-directed has valence
  if(id==="B7") return !!cur().has_splus;
  return true;
}
function required(id){
  if(!visible(id)) return false;
  if(["A1","A2"].includes(id)) return true;
  if(["B1","B2","B3","B8"].includes(id)) return true;
  if(id==="B4") return S.ans.B3==="yes";
  if(id==="B5") return S.ans.B4==="wearer";
  return false;
}
function complete(){ return SCHEMA.every(q=>!required(q.id)||(S.ans[q.id]||"").length); }

function render(){
  const m=cur(), f=$("#form");
  f.innerHTML="";
  SCHEMA.forEach((q,idx)=>{
    const vis=visible(q.id);
    const d=document.createElement("div");
    d.className="q"+(idx===S.active&&vis?" active":"")+(vis?"":" skipped")+
                ((S.ans[q.id]||"").length?" done":"");
    d.dataset.idx=idx;
    const badge=q.clip&&vis
      ? `<span class="cb ${q.clip}" data-clip="${q.clip==="after"?"p":"s"}"
              title="${q.clip==="both"?"answerable from either clip"
                      :"click to play the "+(q.clip==="after"?"after-roll":"moment")}"
         >${CLIP_LABEL[q.clip]}</span>` : "";
    const hasHelp=q.help&&vis;
    const helpOpen=hasHelp&&(S.helpAll||S.help.has(q.id));
    let h=`<h3>${q.q}${required(q.id)?' <span class="muted">·required</span>':''} ${badge}`
        + (hasHelp?`<span class="qh${helpOpen?" on":""}" data-help="${q.id}"
                      title="what this question means">?</span>`:"")+`</h3>`;
    if(vis&&q.note) h+=`<div class="qnote">${q.note}</div>`;
    if(helpOpen) h+=helpHTML(q.help);
    if(vis) h+=seedHTML(q);
    if(!vis) h+=`<div class="muted">skipped by the form's routing</div>`;
    else if(q.text){
      const v=(S.ans[q.id]||"").replace(/"/g,"&quot;");
      h+=`<input type="text" data-f="${q.id}" value="${v}" placeholder="${
           q.id==="B1"?"e.g. hands a card to the player opposite":"optional"}">`;
      if(q.quick) h+=`<div class="opts" style="margin-top:6px">`+q.quick.map(([v2,l],j)=>
        `<button class="opt${S.ans[q.id]===v2?" sel":""}" data-f="${q.id}" data-v="${v2}">
           <kbd>${j+1}</kbd>${l}</button>`).join("")+`</div>`;
    } else {
      const sel=(S.ans[q.id]||"").split(";").filter(Boolean);
      h+=`<div class="opts">`+q.opts.map(([v,l],j)=>
        `<button class="opt${sel.includes(v)?" sel":""}${q.id==="A3"?" flag":""}"
           data-f="${q.id}" data-v="${v}" ${q.multi?'data-multi="1"':''}>
           <kbd>${j+1}</kbd>${l}</button>`).join("")+`</div>`;
    }
    d.innerHTML=h;
    f.appendChild(d);
  });
  const rated=Object.values(S.ratings).filter(r=>r.A1).length;
  const acc=Object.values(S.ratings).filter(r=>r.A1==="yes"&&r.A2==="yes"&&!r.A3).length;
  const times=Object.values(S.ratings).map(r=>+r.seconds_spent).filter(x=>x>0);
  const med=times.length?times.sort((a,b)=>a-b)[Math.floor(times.length/2)]:0;
  $("#counter").textContent=`${S.i+1} / ${S.moments.length}`;
  $("#stats").textContent=`${rated} rated · ${acc} accepted`+(med?` · ~${med}s/item`:"");
  $("#progbar").style.width=(100*rated/S.moments.length)+"%";
  $("#save").disabled=!complete();
  $("#valid").textContent=complete()?"":"answer the required questions";
  $("#clipinfo").textContent=`clip ${m.clip_id.slice(0,8)} · climax ${m.t_climax_sec.toFixed(1)}s`
                             +(m.has_splus?"":" · no after-roll");
  $("#hint").innerHTML=m.task_label_hint
    ? `machine-generated hint (ignore if it disagrees with your eyes): “${m.task_label_hint}”` : "";
}

function setAns(field,val,multi){
  if(multi){
    const s=new Set((S.ans[field]||"").split(";").filter(Boolean));
    s.has(val)?s.delete(val):s.add(val);
    S.ans[field]=[...s].join(";");
  } else {
    S.ans[field]=S.ans[field]===val?"":val;
    const order=SCHEMA.map(q=>q.id), k=order.indexOf(field);
    for(let j=k+1;j<order.length;j++){ if(visible(order[j])){ S.active=j; break; } }
  }
  render();
}

function load(i){
  S.i=Math.max(0,Math.min(i,S.moments.length-1));
  const m=cur();
  const r=S.ratings[m.moment_id]||{};
  S.ans={}; SCHEMA.forEach(q=>{ if(r[q.id]) S.ans[q.id]=r[q.id]; });
  // Pre-select Claude's seed ONLY on a moment you have not saved yet — a saved
  // row is your answer and must never be overwritten by a seed.
  // Prefill ONLY where every seeding model agrees. Where they conflict the
  // field is left blank on purpose — picking an arbitrary winner would anchor
  // you on exactly the moments that are genuinely ambiguous.
  if(!r.A1 && S.seeds[m.moment_id]){
    SCHEMA.forEach(q=>{
      const con=seedConsensusFor(m.moment_id,q.id);
      if(con&&con.value) S.ans[q.id]=con.value;
    });
  }
  S.active=0; S.t0=Date.now();
  showClip("s");
  render();
}
function showClip(which){
  const m=cur();
  S.clip=which;
  $("#vid").src=`/kits/${m.moment_id}/${which==="s"?"clip_s.mp4":"clip_splus.mp4"}`;
  $("#vid").play().catch(()=>{});
  // Make the on-screen source unmistakable: the two clips look alike, and
  // answering B1-B6 off the after-roll would silently corrupt the labels.
  $("#tS").classList.toggle("on",which==="s");
  $("#tP").classList.toggle("on",which!=="s");
  $("#nowplaying").textContent=which==="s"?"showing: Moment (the action + reaction)"
                                          :"showing: After-roll (what the wearer did next)";
  $("#nowplaying").className=which==="s"?"muted":"warnnote";
}
function toast(msg,err){
  const t=$("#toast"); t.textContent=msg; t.className="show"+(err?" err":"");
  setTimeout(()=>t.className="",1200);
}

async function save(advance){
  const m=cur();
  const payload={moment_id:m.moment_id, ...S.ans,
                 seconds_spent:Math.round((Date.now()-S.t0)/1000)};
  const res=await fetch("/api/rating",{method:"POST",
    headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
  const j=await res.json();
  if(!j.ok){ toast("save failed",1); return; }
  S.ratings[m.moment_id]=j.row;
  toast("saved");
  if(advance){
    const nextUnrated=S.moments.findIndex((mm,k)=>k>S.i&&!(S.ratings[mm.moment_id]||{}).A1);
    load(nextUnrated>=0?nextUnrated:S.i+1);
  } else render();
}

document.addEventListener("click",e=>{
  const ad=e.target.closest("button.sval[data-adopt]");
  if(ad){ const f=ad.dataset.adopt, v=ad.dataset.val;
    const q=SCHEMA.find(x=>x.id===f);
    if(q&&q.text) S.ans[f]=v; else S.ans[f]=v;    // text or option: adopt verbatim
    render(); return; }
  const qh=e.target.closest(".qh[data-help]");
  if(qh){ const id=qh.dataset.help;
    S.help.has(id)?S.help.delete(id):S.help.add(id); render(); return; }
  const cb=e.target.closest(".cb[data-clip]");
  if(cb&&!cb.classList.contains("both")){
    if(cb.dataset.clip==="p"&&!cur().has_splus){ toast("no after-roll for this moment",1); return; }
    showClip(cb.dataset.clip==="p"?"p":"s"); return;      // badge = jump to that clip
  }
  const b=e.target.closest("button.opt");
  if(b){ setAns(b.dataset.f,b.dataset.v,b.dataset.multi); return; }
  const q=e.target.closest(".q");
  if(q){ S.active=+q.dataset.idx; render(); }
});
document.addEventListener("input",e=>{
  if(e.target.dataset&&e.target.dataset.f){ S.ans[e.target.dataset.f]=e.target.value;
    $("#save").disabled=!complete(); }
});
function toggleAllHelp(){
  S.helpAll=!S.helpAll;
  localStorage.setItem("srb_help_all",S.helpAll?"1":"0");   // sticky across sessions
  S.help.clear();
  $("#helpall").classList.toggle("on",S.helpAll);
  render();
}
$("#helpall").onclick=toggleAllHelp;
$("#save").onclick=()=>save(true);
$("#prev").onclick=()=>load(S.i-1);
$("#next").onclick=()=>load(S.i+1);
$("#tS").onclick=()=>showClip("s");
$("#tP").onclick=()=>showClip("p");
$("#replay").onclick=()=>{ $("#vid").currentTime=0; $("#vid").play(); };

document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA"){
    if(e.key==="Enter") e.target.blur();
    return;
  }
  const vis=SCHEMA.map((q,i)=>[q,i]).filter(([q])=>visible(q.id));
  if(e.key>="1"&&e.key<="9"){
    const q=SCHEMA[S.active];
    if(q&&visible(q.id)){
      const list=q.opts||q.quick||[];
      const pick=list[+e.key-1];
      if(pick){ setAns(q.id,pick[0],q.multi); e.preventDefault(); }
    }
  } else if(e.key==="ArrowDown"||e.key==="j"){
    const nxt=vis.find(([,i])=>i>S.active); if(nxt){S.active=nxt[1];render();} e.preventDefault();
  } else if(e.key==="ArrowUp"||e.key==="k"){
    const pr=[...vis].reverse().find(([,i])=>i<S.active); if(pr){S.active=pr[1];render();} e.preventDefault();
  } else if(e.key==="Enter"){ if(complete()) save(true); e.preventDefault();
  } else if(e.key===" "){ const v=$("#vid"); v.paused?v.play():v.pause(); e.preventDefault();
  } else if(e.key==="s"){ showClip("s");
  } else if(e.key==="d"){ if(cur().has_splus) showClip("p");
  } else if(e.key==="r"){ $("#vid").currentTime=0; $("#vid").play();
  } else if(e.key==="?"||(e.key==="/"&&e.shiftKey)){ toggleAllHelp(); e.preventDefault();
  } else if(e.key==="ArrowLeft"){ load(S.i-1);
  } else if(e.key==="ArrowRight"){ load(S.i+1); }
});

(async()=>{
  const st=await (await fetch("/api/state")).json();
  S.moments=st.moments; S.ratings=st.ratings; S.mode=st.mode; S.seeds=st.seeds||{};
  $("#mode").textContent=(st.mode==="retest"?"RETEST (blind re-rate) → ":"→ ")+st.csv;
  $("#helpall").classList.toggle("on",S.helpAll);
  const first=S.moments.findIndex(m=>!(S.ratings[m.moment_id]||{}).A1);
  load(first>=0?first:0);
})();
</script>
</body>
